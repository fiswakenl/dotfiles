<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>GV ⇄ Claude</title>
<style>body{font:15px ui-monospace,monospace;max-width:720px;margin:1.5rem auto;padding:0 1rem}#st{color:#888}
#log div{margin:.35rem 0}.me{color:#06c}.ask{color:#a50;font-style:italic}.err{color:#c00}.state{color:#888}.step{color:#2b8a3e;font-size:13px;white-space:pre-wrap}</style>
<div id=st>жду сессию Claude…</div>
<div id=log></div>
<script>
const log=document.getElementById('log'),st=document.getElementById('st'),kinds={};let cur={};
const who=id=>kinds[id]==='quick'?'quick №'+id+' (ветка Claude, мимо чата)':'ask №'+id+' (Claude, в чат)';
function line(k,pre,t){let d=cur[k];if(!d||!d.isConnected){d=document.createElement('div');d.className=k;d.textContent=pre;log.append(d)}
 cur={};cur[k]=d;d.textContent+=t;scrollTo(0,document.body.scrollHeight)}
function add(k,t){cur={};const d=document.createElement('div');d.className=k;d.textContent=t;log.append(d);scrollTo(0,document.body.scrollHeight)}
const handle=m=>{
 if(m.history){log.innerHTML='';cur={};m.history.forEach(handle);return}
 if(m.me)line('me','Вы: ',m.me);
 if(m.ask){kinds[m.id]=m.kind;add('ask','→ '+who(m.id)+(m.rewind?', откат до №'+m.rewind:'')+': '+m.ask)}
 if(m.answer)add('ask','← ответил '+who(m.id)+': '+m.answer);if(m.superseded)add('state','· №'+m.superseded+' заменён');
 if(m.cut)add('state','· ход №'+m.cut+' остановлен: вы продолжили');if(m.dropped)add('state','· ответ на №'+m.dropped+' отброшен');
 if(m.step)add('step',{think:'  Claude думает: ',text:'  Claude пишет: ',tool:'  Claude → ',user:'  в чат: '}[m.step]+m.text);
 if(m.error)add('err',m.error);if(m.state)add('state','· '+m.state)};
function connect(){
 const ws=new WebSocket('ws://'+location.host+'/');
 ws.onopen=()=>{st.textContent='журнал подключён · микрофон — на компьютере'};
 ws.onmessage=ev=>handle(JSON.parse(ev.data));
 ws.onclose=()=>{st.textContent='сессия закрыта, жду новую…';setTimeout(connect,2000)};}
connect();
</script>
